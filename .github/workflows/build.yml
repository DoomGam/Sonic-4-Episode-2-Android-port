name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '8512546'

      - name: Instalar NDK e CMake via sdkmanager
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Compilar APK via Gradle do Sistema
        run: gradle assembleDebug --stacktrace

      - name: Salvar APK como Artefato de Build
        uses: actions/upload-artifact@v4
        with:
          name: Sonic4Ep2-Android-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
